name: Daily Predoc Scraper

on:
  schedule:
    # GitHub cron uses UTC. Time-check step ensures correct America/Chicago slots.
    # 9:00 AM Chicago — 14:00 UTC (CDT) or 15:00 UTC (CST)
    - cron: "0 14,15 * * *"
    # 7:50 PM Chicago — 00:50 UTC (CDT) or 01:50 UTC (CST)
    - cron: "50 0,1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predoc-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check scheduled America/Chicago time
        id: timecheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — proceeding."
            exit 0
          fi
          CHICAGO_HOUR=$(TZ=America/Chicago date +%H)
          CHICAGO_MIN=$(TZ=America/Chicago date +%M)
          if [ "$CHICAGO_HOUR" = "09" ] && [ "$CHICAGO_MIN" = "00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled slot: 9:00 AM Chicago — proceeding."
          elif [ "$CHICAGO_HOUR" = "19" ] && [ "$CHICAGO_MIN" = "50" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled slot: 7:50 PM Chicago — proceeding."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: Chicago time is ${CHICAGO_HOUR}:${CHICAGO_MIN} (not 09:00 or 19:50)."
          fi

      - name: Checkout repository
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run scraper
        if: steps.timecheck.outputs.run == 'true'
        run: python main.py

      - name: Commit updated job data
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predoc_jobs.csv data/predoc_jobs.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update job data from daily scrape [skip ci]"
            git push
          fi

      - name: Upload logs artifact
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: logs/scraper.log
          if-no-files-found: ignore
          retention-days: 7
