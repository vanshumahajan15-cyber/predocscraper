name: Daily Predoc Scraper

on:
  schedule:
    # GitHub cron uses UTC. Pairs cover CDT/CST; time-check enforces Chicago slots.
    - cron: "0 11,12 * * *"   # 6:00 AM Chicago
    - cron: "0 15,16 * * *"   # 10:00 AM Chicago
    - cron: "0 19,20 * * *"   # 2:00 PM Chicago
    - cron: "0 23 * * *"      # 6:00 PM Chicago (CDT)
    - cron: "0 0 * * *"       # 6:00 PM Chicago (CST)
    - cron: "0 3,4 * * *"     # 10:00 PM Chicago
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: predoc-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check scheduled America/Chicago time
        id: timecheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — proceeding."
            exit 0
          fi

          CHICAGO_HOUR=$(TZ=America/Chicago date +%H | sed 's/^0//')
          CHICAGO_MIN=$(TZ=America/Chicago date +%M | sed 's/^0//')
          CHICAGO_HOUR=${CHICAGO_HOUR:-0}
          CHICAGO_MIN=${CHICAGO_MIN:-0}
          CURRENT=$((CHICAGO_HOUR * 60 + CHICAGO_MIN))

          # 6 AM, 10 AM, 2 PM, 6 PM, 10 PM — allow ±10 min for GitHub queue delays
          SLOTS="360 600 840 1080 1320"
          RUN=false
          MATCHED=""

          for slot in $SLOTS; do
            diff=$((CURRENT - slot))
            if [ "$diff" -lt 0 ]; then diff=$(( -diff )); fi
            if [ "$diff" -le 10 ]; then
              RUN=true
              MATCHED=$slot
              break
            fi
          done

          if [ "$RUN" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            case $MATCHED in
              360)  echo "Scheduled slot: 6:00 AM Chicago — proceeding." ;;
              600)  echo "Scheduled slot: 10:00 AM Chicago — proceeding." ;;
              840)  echo "Scheduled slot: 2:00 PM Chicago — proceeding." ;;
              1080) echo "Scheduled slot: 6:00 PM Chicago — proceeding." ;;
              1320) echo "Scheduled slot: 10:00 PM Chicago — proceeding." ;;
            esac
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            printf -v hh "%02d" $((CHICAGO_HOUR))
            printf -v mm "%02d" $((CHICAGO_MIN))
            echo "Skipping: Chicago time is ${hh}:${mm} (not within ±10 min of a scheduled slot)."
          fi

      - name: Checkout repository
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run scraper
        if: steps.timecheck.outputs.run == 'true'
        run: python main.py

      - name: Commit updated job data
        if: steps.timecheck.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/predoc_jobs.csv data/predoc_jobs.json
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: update job data from daily scrape [skip ci]"
            git push
          fi

      - name: Upload logs artifact
        if: steps.timecheck.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: logs/scraper.log
          if-no-files-found: ignore
          retention-days: 7
